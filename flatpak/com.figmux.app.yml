app-id: com.figmux.app
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.10"
command: figmux

finish-args:
  - --share=network
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=system-bus
  - --filesystem=host

modules:
  - name: figmux
    buildsystem: simple
    build-commands:
      - install -Dm755 flatpak/figmux /app/bin/figmux
      - install -Dm644 flatpak/com.figmux.app.desktop /app/share/applications/com.figmux.app.desktop
      - install -Dm644 flatpak/com.figmux.app.metainfo.xml /app/share/metainfo/com.figmux.app.metainfo.xml
      - install -Dm644 assets/com.figmux.app.svg /app/share/icons/hicolor/scalable/apps/com.figmux.app.svg
      - install -Dm644 assets/com.figmux.app.png /app/share/icons/hicolor/512x512/apps/com.figmux.app.png
      - install -Dm755 figma-agent-x86_64-unknown-linux-gnu /app/bin/figma-agent
      - mkdir -p /app/figmux
      - cp -r figmux /app/figmux/figmux
      - install -Dm644 main.py /app/figmux/main.py
    sources:
      - type: file
        url: https://github.com/neetly/figma-agent-linux/releases/download/0.4.3/figma-agent-x86_64-unknown-linux-gnu
        sha256: 85661938e54ad5f6c4af7101d7a7375b1f0f9f132c0c517530b39eea8388656c
      - type: dir
        path: ..
